imagePullSecrets:
  - name: registry-pull-secret

docs:
  replicaCount: 1
  image:
    repository: harbor.dso.cpin.numerique-interieur.fr/documentationcpin/dso-documentation
    pullPolicy: Always
    # tag volontairement vide : le tag retombe sur appVersion de helm/Chart.yaml,
    # la meme valeur que celle utilisée par la CI pour construire l'image.
    # Pensez à faire suivre le appversion sur la version de la console.
    tag: ""
  container:
    port: 8080
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod-http
      nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
    className: nginx
    hosts:
      - host: documentation-prod.app.cpin.numerique-interieur.fr
        paths:
          - path: /
            pathType: Prefix
      - host: cloud-pi-native.fr
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - cloud-pi-native.fr
          - www.cloud-pi-native.fr
        secretName: cloud-pi-native-fr-tls
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
