nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

docs:
  replicaCount: 1
  image:
    repository: ghcr.io/cloud-pi-native/documentation
    pullPolicy: Always
    # Overrides the image tag whose default is the chart appVersion.
    tag: latest
  container:
    port: 8080
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
      - host: example.domain.com
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
