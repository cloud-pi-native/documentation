server {
  listen 0.0.0.0:8080;
  server_name localhost;
  root /opt/bitnami/nginx/html;
  index index.html;

  location /assets/ {
    try_files $uri =404;
  }

  location / {
    try_files $uri.html $uri $uri/ =404;
  }

  error_page 404 /404.html;

  location /health {
    access_log off;
    add_header 'Content-Type' 'application/json';
    return 200 '{"status":"UP"}';
  }
}